name: WOS targeted step diagnostic
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPERVISOR_REPO: https://github.com/theodoreOnzGit/outram-park-backend.git
      SUPERVISOR_REF: 8d31482d127e211614ebb3f66b1076e1ed6dea98
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Record provenance
        run: |
          echo "research_commit=$GITHUB_SHA" | tee verification/wos_targeted_diagnostic_results.txt
          rustc --version | tee -a verification/wos_targeted_diagnostic_results.txt
      - name: Checkout exact supervisor
        run: |
          git clone --no-tags --filter=blob:none --depth 1 "$SUPERVISOR_REPO" supervisor
          cd supervisor
          git fetch --no-tags origin "$SUPERVISOR_REF"
          git checkout --detach "$SUPERVISOR_REF"
          echo "supervisor_commit=$(git rev-parse HEAD)" | tee -a ../verification/wos_targeted_diagnostic_results.txt
      - name: Install diagnostic
        run: |
          mkdir -p supervisor/crates/boon-lay/examples
          cp verification/wos_targeted_step_diagnostic.rs supervisor/crates/boon-lay/examples/wos_targeted_step_diagnostic.rs
      - name: Compile and run diagnostic
        working-directory: supervisor
        run: |
          set -o pipefail
          cargo run -p boon-lay --example wos_targeted_step_diagnostic --release 2>&1 | tee -a ../verification/wos_targeted_diagnostic_results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wos-targeted-step-diagnostic-results
          path: verification/wos_targeted_diagnostic_results.txt

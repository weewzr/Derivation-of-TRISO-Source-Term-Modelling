name: Three-layer multistate matrix verification
on:
  push:
    branches: [main]
    paths:
      - verification/three_layer_multistate_matrix.rs
      - .github/workflows/three-layer-multistate-matrix.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPERVISOR_REPO: https://github.com/theodoreOnzGit/outram-park-backend.git
      SUPERVISOR_REF: 8d31482d127e211614ebb3f66b1076e1ed6dea98
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          echo "research_commit=$GITHUB_SHA" | tee verification/three_layer_multistate_matrix_results.txt
          rustc --version | tee -a verification/three_layer_multistate_matrix_results.txt
      - run: |
          git clone --no-tags --filter=blob:none --depth 1 "$SUPERVISOR_REPO" supervisor
          cd supervisor && git fetch --no-tags origin "$SUPERVISOR_REF" && git checkout --detach "$SUPERVISOR_REF"
          echo "supervisor_commit=$(git rev-parse HEAD)" | tee -a ../verification/three_layer_multistate_matrix_results.txt
      - run: |
          mkdir -p supervisor/crates/boon-lay/examples
          cp verification/three_layer_multistate_matrix.rs supervisor/crates/boon-lay/examples/three_layer_multistate_matrix.rs
      - working-directory: supervisor
        run: |
          set -o pipefail
          cargo run -p boon-lay --example three_layer_multistate_matrix --release 2>&1 | tee -a ../verification/three_layer_multistate_matrix_results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-layer-multistate-matrix-results
          path: verification/three_layer_multistate_matrix_results.txt

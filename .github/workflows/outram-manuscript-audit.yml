name: Outram Park manuscript render audit
on:
  push:
    branches: [main]
    paths:
      - 'ray to outram park/TRISO_Source_Term_Derivation.md'
      - 'ray to outram park/TRISO_Source_Term_Derivation.tex'
      - 'ray to outram park/references.bib'
      - '.github/workflows/outram-manuscript-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Markdown math inventory
        run: |
          python verification/validate_markdown_math.py
          cd verification
          npm install --ignore-scripts --no-audit --no-fund
          cd ..
          node verification/katex_strict_lint.mjs
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-luatex texlive-latex-extra texlive-fonts-recommended
      - name: Compile twice
        working-directory: ray to outram park
        run: |
          set -o pipefail
          lualatex -interaction=nonstopmode -halt-on-error TRISO_Source_Term_Derivation.tex | tee latex_pass1.log
          bibtex TRISO_Source_Term_Derivation | tee bibtex.log
          lualatex -interaction=nonstopmode -halt-on-error TRISO_Source_Term_Derivation.tex | tee latex_pass2.log
          lualatex -interaction=nonstopmode -halt-on-error TRISO_Source_Term_Derivation.tex | tee latex_pass3.log
      - name: Audit warnings
        working-directory: ray to outram park
        run: |
          if grep -E 'LaTeX Warning: (Reference|Citation).*undefined|multiply defined|ignoring duplicate destination' latex_pass3.log; then
            echo 'Undefined reference/citation, duplicate label, or duplicate PDF destination detected'
            exit 1
          fi
          echo 'LaTeX compile/reference audit PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outram-manuscript-render-audit
          path: |
            ray to outram park/TRISO_Source_Term_Derivation.pdf
            ray to outram park/latex_pass1.log
            ray to outram park/latex_pass2.log
            ray to outram park/latex_pass3.log
            ray to outram park/bibtex.log

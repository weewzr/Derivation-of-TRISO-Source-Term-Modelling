name: Two-layer WOS high-power epsilon verification
on:
  push:
    branches:
      - main
    paths:
      - verification/two_layer_wos_epsilon_high_power.rs
      - .github/workflows/two-layer-wos-high-power.yml
  workflow_dispatch:
jobs:
  high-power:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPERVISOR_REPO: https://github.com/theodoreOnzGit/outram-park-backend.git
      SUPERVISOR_REF: 8d31482d127e211614ebb3f66b1076e1ed6dea98
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Record provenance
        run: |
          echo "research_commit=$GITHUB_SHA" | tee verification/two_layer_wos_high_power_results.txt
          echo "predeclared_N_per_epsilon=10000" | tee -a verification/two_layer_wos_high_power_results.txt
          echo "precision_target=worst_case_95pct_halfwidth_le_0.01" | tee -a verification/two_layer_wos_high_power_results.txt
          rustc --version | tee -a verification/two_layer_wos_high_power_results.txt
      - name: Checkout exact supervisor
        run: |
          git clone --no-tags --filter=blob:none --depth 1 "$SUPERVISOR_REPO" supervisor
          cd supervisor
          git fetch --no-tags origin "$SUPERVISOR_REF"
          git checkout --detach "$SUPERVISOR_REF"
          echo "supervisor_commit=$(git rev-parse HEAD)" | tee -a ../verification/two_layer_wos_high_power_results.txt
      - name: Install verification adapter
        run: |
          mkdir -p supervisor/crates/boon-lay/examples
          cp verification/two_layer_wos_epsilon_high_power.rs supervisor/crates/boon-lay/examples/two_layer_wos_epsilon_high_power.rs
      - name: Compile and run predeclared high-power ensemble
        working-directory: supervisor
        run: |
          set -o pipefail
          cargo run -p boon-lay --example two_layer_wos_epsilon_high_power --release 2>&1 | tee -a ../verification/two_layer_wos_high_power_results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-layer-wos-high-power-results
          path: verification/two_layer_wos_high_power_results.txt

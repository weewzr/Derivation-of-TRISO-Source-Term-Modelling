name: Hard five-layer high-precision matrix cross-check
on:
  push:
    branches: [main]
    paths:
      - verification/hard_five_layer_high_precision.py
      - .github/workflows/hard-five-layer-high-precision.yml
  workflow_dispatch:
jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check mpmath==1.3.0 numpy==2.3.3
      - run: |
          echo "research_commit=$GITHUB_SHA" | tee verification/hard_five_layer_high_precision_results.txt
          python --version | tee -a verification/hard_five_layer_high_precision_results.txt
          python - <<'PY' | tee -a verification/hard_five_layer_high_precision_results.txt
          import numpy,mpmath
          print("numpy="+numpy.__version__)
          print("mpmath="+mpmath.__version__)
          print("precisions=50,80,120 decimal digits")
          PY
      - name: Run high-precision cross-check
        run: |
          set -o pipefail
          python verification/hard_five_layer_high_precision.py 2>&1 | tee -a verification/hard_five_layer_high_precision_results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hard-five-layer-high-precision-results
          path: verification/hard_five_layer_high_precision_results.txt

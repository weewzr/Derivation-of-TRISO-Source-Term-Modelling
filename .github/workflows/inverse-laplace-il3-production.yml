name: IL-3 Process-C production
on:
  push:
    branches: [main]
    paths:
      - 'verification/inverse_laplace_il3_production.py'
      - 'verification/inverse_laplace_il3_plan.md'
      - '.github/workflows/inverse-laplace-il3-production.yml'
  workflow_dispatch:
jobs:
  il3-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mpmath==1.3.0
      - name: Full 81-point two-method production inversion
        run: python verification/inverse_laplace_il3_production.py | tee verification/inverse_laplace_il3_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inverse-laplace-il3-production-results
          path: verification/inverse_laplace_il3_results.json
